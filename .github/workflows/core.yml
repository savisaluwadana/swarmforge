name: Deterministic core
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark validation dependencies
        run: python -m pip install -r services/swarmforge/requirements.lock
      - name: Compile
        run: python -m compileall -q services/swarmforge/src
      - name: Unit and randomized invariant tests
        run: make test PYTHON=python
      - name: Run measured smoke experiment
        run: make demo PYTHON=python
      - name: Verify deterministic replay
        run: make replay PYTHON=python
      - name: Run scoped lease smoke experiment
        run: make demo-scoped PYTHON=python
      - name: Verify scoped replay
        run: make replay-scoped PYTHON=python
      - name: Run peer auction smoke experiment
        run: make demo-auction PYTHON=python
      - name: Verify peer auction replay
        run: make replay-auction PYTHON=python
      - name: Run predeclared research matrix with replay and trace audit
        run: make benchmark-research PYTHON=python
      - name: Summarize and checksum measured evidence
        if: always()
        run: python scripts/release_evidence.py artifacts/benchmark-research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-smoke
          path: |
            artifacts/demo.json
            artifacts/scoped.json
            artifacts/auction.json
            artifacts/benchmark-research/
