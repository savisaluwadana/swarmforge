name: PostgreSQL persistence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swarmforge
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: swarmforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarmforge -d swarmforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SWARMFORGE_TEST_DATABASE_URL: postgresql://swarmforge:test-only-password@localhost:5432/swarmforge_test
      PYTHONPATH: services/swarmforge/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/swarmforge/requirements-persistence.txt
      - name: Real database integration tests
        run: python -m unittest discover -s services/swarmforge/tests -p test_persistence.py -v
      - name: REST API integration tests
        run: python -m unittest discover -s services/swarmforge/tests -p test_api.py -v
      - name: Agent gateway and MCP integration tests
        run: python -m unittest discover -s services/swarmforge/tests -p test_agent.py -v
      - name: Compose configuration
        env:
          POSTGRES_PASSWORD: test-only-password
          DATABASE_URL: postgresql://swarmforge:test-only-password@postgres:5432/swarmforge
        run: docker compose config --quiet
