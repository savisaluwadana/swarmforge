[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmforge"
version = "0.1.0"
description = "Deterministic, simulation-only robotics reliability experiments"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
swarmforge = "swarmforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
